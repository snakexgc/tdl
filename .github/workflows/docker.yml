name: docker

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][1-9]*"
      - "!v*_dev_*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]{8})([1-9][0-9]*)$ ]]; then
            echo "Docker release tag must use vYYYYMMDDN (for example v202609043)" >&2
            exit 1
          fi
          tag_date="${BASH_REMATCH[1]}"
          parsed_date="$(date -u -d "${tag_date:0:4}-${tag_date:4:2}-${tag_date:6:2}" +%Y%m%d 2>/dev/null || true)"
          if [[ "$parsed_date" != "$tag_date" ]]; then
            echo "Docker release tag contains an invalid date: ${tag_date}" >&2
            exit 1
          fi

          git fetch --force --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "Docker release tag ${GITHUB_REF_NAME} does not point to a commit on master" >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_tag="${GITHUB_REF_NAME}"
          short_sha="$(git rev-parse --short HEAD)"
          version="${release_tag}_docker"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${image}:${release_tag}"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=${GITHUB_REPOSITORY#*/}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract build args
        id: args
        shell: bash
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git show -s --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.args.outputs.commit }}
            COMMIT_DATE=${{ steps.args.outputs.commit_date }}
            BUILD_MAX_PROCS=2
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
