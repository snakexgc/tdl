name: release

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            prev_tag="$(git describe --tags --match "v*" --abbrev=0 HEAD^ 2>/dev/null || true)"
            {
              echo "mode=stable"
              echo "prev_tag=${prev_tag}"
              echo "version=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_OUTPUT"
          else
            # GoReleaser parses the nearest tag even in snapshot mode.
            # Date-based prerelease tags are intentionally not SemVer. Hide all
            # non-stable tags in this disposable checkout before the snapshot
            # build so they cannot become GoReleaser's inferred base version.
            while IFS= read -r tag; do
              if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                git tag --delete "$tag"
              fi
            done < <(git tag --list)

            case "$GITHUB_REF_NAME" in
              dev|master)
                channel="$GITHUB_REF_NAME"
                ;;
              *)
                echo "Prereleases can only be built from dev or master, got: ${GITHUB_REF_NAME}" >&2
                exit 1
                ;;
            esac

            release_date="$(TZ=Asia/Shanghai date +%Y%m%d)"
            short_sha="$(git rev-parse --short HEAD)"
            prerelease_tag="${release_date}_${channel}_${short_sha}"
            {
              echo "mode=prerelease"
              echo "tag=${prerelease_tag}"
              echo "version=${prerelease_tag}"
              echo "channel=${channel}"
              echo "release_date=${release_date}"
              echo "short_sha=${short_sha}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      - name: Run GoReleaser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.release.outputs.prev_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          # A GoReleaser task starts a go build process, which has its own
          # parallel compiler workers. Bound both levels to avoid runner OOM.
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail

          release_args=(release --clean --timeout 2h --parallelism 1)
          if [[ "$RELEASE_MODE" == "prerelease" ]]; then
            release_args+=(--snapshot)
          fi

          monitor_resources() {
            while sleep 60; do
              echo "::group::GoReleaser resource usage at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              free -h || true
              df -h . || true
              ps -eo pid,ppid,pcpu,pmem,rss,etime,comm --sort=-rss | sed -n '1,15p' || true
              echo "::endgroup::"
            done
          }

          monitor_resources &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT

          goreleaser "${release_args[@]}"
      - name: Publish prerelease
        if: steps.release.outputs.mode == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(
            find .tdl/dist -maxdepth 1 -type f \( \
              -name '*.tar.gz' -o \
              -name '*.zip' -o \
              -name '*checksums.txt' \
            \) -print0 | sort -z
          )

          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found in .tdl/dist"
            exit 1
          fi

          notes_file="$(mktemp)"
          {
            echo "Automated prerelease build from ${GITHUB_REF_NAME}."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$notes_file"

          release_tag="${{ steps.release.outputs.tag }}"
          release_title="tdl ${release_tag}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun for the same commit must update the exact requested
            # version instead of inventing a second tag.
            gh release upload "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false
          else
            gh release create "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false
          fi
