name: release

on:
  push:
    branches:
      - dev
    tags:
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][1-9]*'
      - '!v*_dev_*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]{8})([1-9][0-9]*)$ ]]; then
              echo "Stable release tag must use vYYYYMMDDN (for example v202609043)" >&2
              exit 1
            fi
            tag_date="${BASH_REMATCH[1]}"
            parsed_date="$(date -u -d "${tag_date:0:4}-${tag_date:4:2}-${tag_date:6:2}" +%Y%m%d 2>/dev/null || true)"
            if [[ "$parsed_date" != "$tag_date" ]]; then
              echo "Stable release tag contains an invalid date: ${tag_date}" >&2
              exit 1
            fi

            git fetch --force --no-tags origin master:refs/remotes/origin/master
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
              echo "Stable release tag ${GITHUB_REF_NAME} does not point to a commit on master" >&2
              exit 1
            fi

            prev_tag="$(git describe --tags --match "v*" --exclude "v*_dev_*" --abbrev=0 HEAD^ 2>/dev/null || true)"
            {
              echo "mode=stable"
              echo "prev_tag=${prev_tag}"
              echo "version=${GITHUB_REF_NAME}"
            } >> "$GITHUB_OUTPUT"
          else
            # The preview version is supplied explicitly. Hide all tags in this
            # disposable checkout so GoReleaser cannot infer an old SemVer or a
            # date-based stable version as the snapshot base.
            while IFS= read -r tag; do
              if [[ -n "$tag" ]]; then
                git tag --delete "$tag"
              fi
            done < <(git tag --list)

            if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
              echo "Prereleases can only be built from dev, got: ${GITHUB_REF}" >&2
              exit 1
            fi

            release_date="$(TZ=Asia/Shanghai date +%Y%m%d)"
            short_sha="$(git rev-parse --short HEAD)"
            prerelease_tag="v${release_date}_dev_${short_sha}"
            {
              echo "mode=prerelease"
              echo "tag=${prerelease_tag}"
              echo "version=${prerelease_tag}"
              echo "release_date=${release_date}"
              echo "short_sha=${short_sha}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      - name: Run GoReleaser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.release.outputs.prev_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          # A GoReleaser task starts a go build process, which has its own
          # parallel compiler workers. Bound both levels to avoid runner OOM.
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail

          release_args=(release --clean --timeout 2h --parallelism 1)
          if [[ "$RELEASE_MODE" == "prerelease" ]]; then
            release_args+=(--snapshot)
          fi

          monitor_resources() {
            while sleep 60; do
              echo "::group::GoReleaser resource usage at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              free -h || true
              df -h . || true
              ps -eo pid,ppid,pcpu,pmem,rss,etime,comm --sort=-rss | sed -n '1,15p' || true
              echo "::endgroup::"
            done
          }

          monitor_resources &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT

          goreleaser "${release_args[@]}"
      - name: Publish prerelease
        if: steps.release.outputs.mode == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(
            find .tdl/dist -maxdepth 1 -type f \( \
              -name '*.tar.gz' -o \
              -name '*.zip' -o \
              -name '*checksums.txt' \
            \) -print0 | sort -z
          )

          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found in .tdl/dist"
            exit 1
          fi

          notes_file="$(mktemp)"
          {
            echo "Automated prerelease build from ${GITHUB_REF_NAME}."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$notes_file"

          release_tag="${{ steps.release.outputs.tag }}"
          release_title="tdl ${release_tag}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun for the same commit must update the exact requested
            # version instead of inventing a second tag.
            gh release upload "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false
          else
            gh release create "$release_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false
          fi
