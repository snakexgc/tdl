version: 2
project_name: tdl
dist: .tdl/dist
snapshot:
  # release.yml supplies the requested yyyyMMdd_<channel>_<shortSHA> version.
  version_template: '{{ .Env.RELEASE_VERSION }}'
env:
  - GO111MODULE=on
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/snakexgc/tdl/pkg/consts.Version={{ .Version }}
      - -X github.com/snakexgc/tdl/pkg/consts.Commit={{ .ShortCommit }}
      - -X github.com/snakexgc/tdl/pkg/consts.CommitDate={{ .CommitDate }}
      - -X github.com/snakexgc/tdl/pkg/consts.GOARM={{ .Arm }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - riscv64
      - loong64
    goarm:
      - 5
      - 6
      - 7
checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "386" }}32bit
      {{- else if eq .Arch "amd64" }}64bit
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README*.md
      - LICENSE
changelog:
  use: github
  sort: asc
  groups:
    - title: New Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Documentation updates'
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 2
    - title: 'Refactoring'
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 3
    - title: Others
      order: 4
release:
  draft: false
