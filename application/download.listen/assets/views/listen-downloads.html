<section class="listen-page">
  <header class="page-head">
    <div><h1>监听下载</h1><p>从指定的 Telegram 聊天中自动下载新文件。</p></div>
    <a class="btn secondary" href="/downloads" data-app-link>查看下载任务</a>
  </header>
  <section aria-labelledby="listen-rules-title">
    <header class="listen-section-head">
      <h2 id="listen-rules-title">监听规则</h2>
      <div class="actions">
        <button id="listen-refresh-dialogs" class="btn secondary" type="button">刷新聊天列表</button>
        <button id="listen-add" class="btn primary" type="button" disabled>添加规则</button>
      </div>
    </header>
    <div class="listen-draft" id="listen-draft" hidden>
      <span id="listen-draft-state" role="status"></span>
      <div class="actions">
        <button id="listen-discard" class="btn secondary" type="button">放弃修改</button>
        <button id="listen-save" class="btn primary" type="button">保存规则</button>
      </div>
    </div>
    <p id="listen-error" class="notice" role="alert" hidden></p>
    <div id="listen-rule-list" class="listen-rule-list"></div>
  </section>
  <section class="listen-monitor" aria-labelledby="listen-monitor-title">
    <h2 id="listen-monitor-title">监听状态与任务</h2>
    <div id="listen-service-status" class="notice" role="status"></div>
    <details class="listen-filter-details" id="listen-filter-details" hidden>
      <summary>当前过滤条件</summary>
      <div id="listen-filters" class="listen-filter-info"></div>
    </details>
    <div id="listen-metrics" class="listen-metrics"></div>
    <p id="listen-task-error" class="notice error" role="status" hidden></p>
    <div id="listen-sources" class="listen-sources"></div>
  </section>
</section>
