<section class="listen-page">
  <header class="page-header"><div><h1>监听下载</h1><p>选择聊天来源，收到新文件后自动下载。</p></div><a class="btn secondary" href="/downloads" data-app-link>查看下载任务</a></header>
  <div id="listen-service-status" class="notice" role="status"></div>
  <div id="listen-filters" class="listen-filter-info"></div>
  <div class="listen-toolbar"><button id="listen-add" class="btn" type="button">＋ 添加规则</button><button id="listen-refresh-dialogs" class="btn secondary" type="button">刷新聊天列表</button><span id="listen-draft-state" role="status"></span><button id="listen-discard" class="btn secondary" type="button">放弃修改</button><button id="listen-save" class="btn" type="button">保存</button></div>
  <p id="listen-error" class="notice" role="alert" hidden></p>
  <div id="listen-rule-list" class="listen-rule-list"></div>
  <section class="listen-monitor"><h2>运行状态与任务</h2><div id="listen-metrics" class="listen-metrics"></div><p id="listen-task-error" class="notice error" role="status" hidden></p><div id="listen-sources" class="listen-sources"></div></section>
</section>
