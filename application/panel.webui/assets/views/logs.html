<section class="view" id="logs-view">
  <header class="page-head">
    <div>
      <h1>日志管理</h1>
      <p>查看当前账号和系统的运行记录。</p>
    </div>
  </header>
  <div class="page-tabs" id="logs-tabs" role="tablist" aria-label="日志视图">
    <button
      type="button"
      role="tab"
      class="tab-button"
      data-tab="runtime"
      aria-controls="logs-runtime"
      id="logs-tab-runtime"
    >
      运行日志</button
    ><button
      type="button"
      role="tab"
      class="tab-button"
      data-tab="health"
      aria-controls="logs-health"
      id="logs-tab-health"
    >
      组件健康
    </button>
  </div>
  <form class="log-filters" id="logs-filters">
    <div class="log-search">
      <label for="logs-query">关键词</label>
      <div class="log-search-controls">
        <input id="logs-query" type="search" maxlength="256" placeholder="模块、消息或错误内容">
        <button class="btn primary" type="submit">搜索</button>
      </div>
    </div>
    <details class="log-advanced" id="logs-advanced">
      <summary><span>高级筛选 <span id="logs-filter-count"></span></span></summary>
      <div class="log-selects">
        <label>功能模块
          <select id="logs-feature"><option value="">全部功能模块</option></select>
        </label>
        <label>细分模块
          <select id="logs-component"><option value="">全部细分模块</option></select>
        </label>
        <label data-log-filter>级别
          <select id="logs-level">
            <option value="">全部级别</option>
            <option value="debug">调试</option>
            <option value="info">信息</option>
            <option value="warn">警告</option>
            <option value="error">错误</option>
          </select>
        </label>
        <label data-log-filter>类型
          <select id="logs-kind">
            <option value="">全部日志</option>
            <option value="runtime">运行日志</option>
            <option value="diagnostic">诊断事件</option>
          </select>
        </label>
        <label data-log-filter>时间
          <select id="logs-range">
            <option value="">全部保留记录</option>
            <option value="15">最近 15 分钟</option>
            <option value="60">最近 1 小时</option>
            <option value="1440">最近 24 小时</option>
          </select>
        </label>
      </div>
    </details>
  </form>
  <p class="notice" id="logs-notice" role="status"></p>
  <div class="log-results-head">
    <div class="log-results-meta">
      <p id="logs-summary" role="status"></p>
      <p class="subtle" id="logs-page-note"></p>
    </div>
    <div class="log-result-actions">
      <button class="btn secondary" id="logs-live" type="button">暂停刷新</button>
      <button class="btn secondary" id="logs-refresh" type="button">刷新</button>
      <a class="btn secondary" id="logs-export" href="/api/logs?download=1">导出日志</a>
    </div>
  </div>
  <section id="logs-runtime" role="tabpanel" aria-labelledby="logs-tab-runtime">
    <div class="table-wrap log-table-wrap" role="region" aria-label="日志列表" tabindex="0">
      <table class="log-table" aria-label="运行日志" role="table">
        <thead role="rowgroup">
          <tr role="row">
            <th scope="col" role="columnheader">时间</th>
            <th scope="col" role="columnheader">级别</th>
            <th scope="col" role="columnheader">功能 / 细分模块</th>
            <th scope="col" role="columnheader">日志内容</th>
            <th scope="col" role="columnheader">操作</th>
          </tr>
        </thead>
        <tbody id="logs-rows" role="rowgroup"></tbody>
      </table>
    </div>
    <div class="log-pagination">
      <button type="button" class="btn secondary" id="logs-latest">返回最新</button>
      <button type="button" class="btn secondary" id="logs-older">更早日志</button>
    </div>
    <p class="subtle log-retention">
      页面保留最近 2000 条结构化日志。日志文件每 10 MB 轮转，最多保留 3 份备份和
      7 天；重启后恢复当前日志文件中的记录。
    </p>
  </section>
  <section
    id="logs-health"
    role="tabpanel"
    aria-labelledby="logs-tab-health"
    hidden
  >
    <p class="subtle">查看组件状态和调度诊断。服务启停请前往<a data-app-link href="/modules">模块管理</a>。</p>
    <div id="logs-health-content"></div>
  </section>
</section>
