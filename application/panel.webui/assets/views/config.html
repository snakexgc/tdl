<section class="view" id="view-config">
  <header class="page-head">
    <div>
      <h1>设置</h1>
      <p>按业务调整参数。每个区块独立保存，高级参数按需展开。</p>
    </div>
    <button id="settings-reload" class="btn secondary" type="button">
      重新读取 · 保留草稿
    </button>
  </header>
  <div
    class="tabs page-tabs settings-tabs"
    id="settings-tabs"
    aria-label="设置分类"
  ></div>
  <div
    class="notice"
    id="settings-message"
    role="status"
    aria-live="polite"
  ></div>
  <div
    class="settings-draft-status"
    id="settings-draft-status"
    role="status"
  ></div>
  <div id="settings-panels"></div>
</section>
