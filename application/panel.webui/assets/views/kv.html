<section class="view" id="view-kv" aria-label="链接记录">
  <div class="kv-workspace">
    <div class="task-toolbar">
      <label class="search-field">
        <span class="sr-only">搜索链接记录</span>
        <input id="kv-search" type="search" placeholder="搜索文件名或链接">
      </label>
      <div class="kv-sort-controls">
        <label>
          <span class="sr-only">链接记录排序方式</span>
          <select id="kv-sort">
            <option value="created_at">按创建时间</option>
            <option value="expires_at">按有效期</option>
            <option value="name">按文件名</option>
            <option value="downloaded">按下载状态</option>
            <option value="status">按下载器状态</option>
            <option value="url">按链接地址</option>
          </select>
        </label>
        <button class="btn secondary" id="kv-sort-direction" type="button">降序</button>
      </div>
      <button class="btn secondary" id="refresh-kv" type="button">刷新</button>
    </div>
    <div class="kv-list-meta">
      <span id="kv-result-count"></span>
      <button class="text-button" id="select-undownloaded" type="button">选择未下载</button>
    </div>
    <div class="bulk-toolbar" id="kv-bulk" hidden>
      <span id="kv-selection-count" role="status"></span>
      <button class="btn primary compact" id="download-selected" type="button">发送到下载器</button>
      <button class="btn danger compact" id="delete-selected" type="button">删除记录</button>
    </div>
    <div class="notice" id="kv-status" role="status"></div>
    <div class="table-shell">
      <table id="kv-table" class="task-table" aria-label="下载链接" role="table">
        <colgroup>
          <col class="kv-select-col">
          <col class="kv-file-col">
          <col class="kv-status-col">
          <col class="kv-expiry-col">
          <col class="kv-action-col">
        </colgroup>
        <thead role="rowgroup">
          <tr role="row">
            <th class="select-col" scope="col" role="columnheader">
              <label class="task-check">
                <input id="select-all-kv" type="checkbox" aria-label="选择当前链接列表">
                <span class="task-mobile-label">全选当前列表</span>
              </label>
            </th>
            <th scope="col" role="columnheader" data-kv-sort-header="name">文件<span class="col-resizer"></span></th>
            <th scope="col" role="columnheader" data-kv-sort-header="downloaded">下载状态<span class="col-resizer"></span></th>
            <th scope="col" role="columnheader" data-kv-sort-header="expires_at">有效期<span class="col-resizer"></span></th>
            <th scope="col" role="columnheader">操作</th>
          </tr>
        </thead>
        <tbody id="kv-body" role="rowgroup">
          <tr role="row"><td colspan="5" class="empty" role="cell">正在加载链接…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="kv-maintenance">
    <button class="btn secondary" id="clean-storage" type="button">清理存储</button>
  </div>
</section>
