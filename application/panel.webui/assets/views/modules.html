<section class="view" id="view-modules">
  <header class="page-head">
    <div>
      <h1>模块管理</h1>
      <p id="module-mode">启停选择保存后需重启生效。</p>
      <a data-app-link href="/config">查看待生效修改并重启</a>
    </div>
    <div class="actions">
      <button class="btn secondary" id="refresh-modules" type="button">
        刷新状态
      </button>
    </div>
  </header>
  <div class="notice" id="module-status" role="status"></div>
  <div class="module-overview" id="module-overview" hidden></div>
  <div class="module-list" id="module-list"></div>
</section>
