<section class="view" id="view-forwards">
  <header class="page-head">
    <div>
      <div class="forward-title-line">
        <h1>转发管理</h1>
        <span class="pill muted" id="forward-running-badge" title="所有尚未结束（含等待、运行、暂停及待重试）的转发任务数">进行中 —</span>
      </div>
      <p>查看正在进行和最近完成的转发任务，可暂停、继续或删除任务。</p>
    </div>
    <div class="actions"><a class="btn secondary" data-app-link href="/config?tab=forward">转发设置</a>
      <button class="btn secondary" id="forward-reload" type="button">刷新</button>
    </div>
  </header>

  <dl class="forward-summary" aria-label="转发任务统计">
    <div class="forward-stat">
      <dt>等待中</dt>
      <dd id="forward-stat-waiting">—</dd>
    </div>
    <div class="forward-stat">
      <dt>转发中</dt>
      <dd id="forward-stat-running">—</dd>
    </div>
    <div class="forward-stat">
      <dt>已暂停</dt>
      <dd id="forward-stat-paused">—</dd>
    </div>
    <div class="forward-stat">
      <dt>失败</dt>
      <dd id="forward-stat-failed">—</dd>
    </div>
  </dl>

  <div class="notice" id="forward-status" role="status"></div>

  <div class="task-toolbar forward-toolbar">
    <label><span class="sr-only">转发任务状态</span><select id="forward-state-filter"><option value="all">全部状态</option><option value="queued">排队中</option><option value="running">转发中</option><option value="paused">已暂停</option><option value="retrying">重试中</option><option value="done">已完成</option><option value="error">失败</option></select></label>
    <div class="forward-select-actions">
      <button class="btn secondary compact" id="forward-select-all" type="button">全选</button>
      <button class="btn secondary compact" id="forward-select-active" type="button">选中进行中</button>
      <button class="btn secondary compact" id="forward-select-clear" type="button">清空选择</button>
    </div>
  </div>
  <div class="bulk-toolbar" id="forward-bulk-actions" hidden>
    <span id="forward-selection-count">已选 0 项</span>
    <button class="btn primary compact" id="forward-resume-selected" type="button" disabled>继续选中</button>
    <button class="btn secondary compact" id="forward-pause-selected" type="button" disabled>暂停选中</button>
    <button class="btn danger compact" id="forward-delete-selected" type="button" disabled>删除选中</button>
  </div>

  <div class="table-shell forward-table-shell">
    <table id="forward-table" class="task-table" role="table" aria-label="转发任务">
      <thead>
        <tr>
          <th scope="col" class="select-col">
            <label class="task-check">
              <input id="forward-select-visible" type="checkbox" aria-label="全选当前列表的转发任务">
              <span class="task-mobile-label" aria-hidden="true">全选当前列表</span>
            </label>
          </th>
          <th scope="col">转发路径</th>
          <th scope="col">触发 / 模式</th>
          <th scope="col">状态</th>
          <th scope="col">进度</th>
          <th scope="col">更新时间</th>
          <th scope="col">操作</th>
        </tr>
      </thead>
      <tbody id="forward-body">
        <tr><td colspan="7" class="empty">正在加载...</td></tr>
      </tbody>
    </table>
  </div>
</section>
