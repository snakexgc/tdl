<section class="view" id="view-modules">
  <header class="page-head">
    <div>
      <h1>模块管理</h1>
      <p>启用或关闭运行中的功能模块。watch 负责监听表情和生成临时链接，HTTP 负责向外部下载器提供文件流，aria2 管理器只负责 RPC、恢复、监控及可选的自动提交。</p>
    </div>
    <div class="actions">
      <button class="btn secondary" id="refresh-modules" type="button">刷新状态</button>
    </div>
  </header>
  <div class="notice" id="module-status"></div>
  <div class="module-overview" id="module-overview" hidden></div>
  <div class="module-list" id="module-list"></div>
</section>
